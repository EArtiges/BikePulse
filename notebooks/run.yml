Oslo:
  collect_area:
    name: Oslo, Norway
    filename: data/Oslo/oslo_area.geoparquet

  grid:
    resolution: 8
    full_grid_filename: data/Oslo/full_hex_grid.geoparquet
    clipped_grid_filename: data/Oslo/hex_grid.geoparquet

  POIs:
    crs: 32632
    folder: data/Oslo/POIs/

  population:
    input: data/global/GHS_POP/R3_C19.csv
    output: data/global/GHS_POP/R3_C19.gpkg

  analysis:
    clustering:
      algorithm: kmeans
      n_clusters: 5
      cluster_range: [2, 20]
      n_iterations: 50
      normalization: l1
      random_seed: 42

    factorization:
      method: tucker
      rank: [3, 5, 5]
      weekdays_only: true
      month_range: [1, 12]
      n_bootstraps: 100
      consensus_threshold: 0.5
      random_seed: 42

    output:
      results_dir: results/{city}
      save_plots: true
      plot_format: png
      plot_dpi: 300

