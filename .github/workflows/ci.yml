name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort

      - name: Run black
        run: black --check --diff notebooks/

      - name: Run ruff
        run: ruff check notebooks/

      - name: Run isort
        run: isort --check-only --diff notebooks/

  pipeline-validation:
    name: Pipeline Validation (Smoke Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Run pipeline validation tests
        run: |
          pytest tests/test_pipeline.py -v

  environment-check:
    name: Geospatial Environment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install GDAL Python bindings matching system version
          pip install GDAL==$(gdal-config --version)
          # Install other dependencies (excluding GDAL from requirements.txt)
          grep -v "^GDAL==" requirements.txt > /tmp/requirements-no-gdal.txt
          pip install -r /tmp/requirements-no-gdal.txt
          pip install pytest

      - name: Run environment tests
        run: |
          pytest tests/test_environment.py -v

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install GDAL Python bindings matching system version
          pip install GDAL==$(gdal-config --version)
          # Install other dependencies (excluding GDAL from requirements.txt)
          grep -v "^GDAL==" requirements.txt > /tmp/requirements-no-gdal.txt
          pip install -r /tmp/requirements-no-gdal.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/test_utils.py tests/test_geo_utils.py --cov=notebooks --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  documentation:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run documentation tests
        run: |
          pytest tests/test_documentation.py -v

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: safety check --file requirements.txt --continue-on-error || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  notebook-quality:
    name: Notebook Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for notebook outputs
        run: |
          # Check for non-empty outputs (outputs with content, not just "outputs": [])
          if find . -name "*.ipynb" -not -path "./old_notebooks/*" -exec grep -l '"outputs": \[{' {} \; 2>/dev/null | grep -q .; then
            echo "Error: Found notebooks with outputs. Please clear outputs before committing."
            echo "Run: jupyter nbconvert --clear-output --inplace *.ipynb"
            find . -name "*.ipynb" -not -path "./old_notebooks/*" -exec grep -l '"outputs": \[{' {} \; 2>/dev/null
            exit 1
          else
            echo "All notebooks have cleared outputs ✓"
          fi

      - name: Check for hardcoded paths
        run: |
          if grep -r "/home/" --include="*.ipynb" --exclude-dir="old_notebooks" . 2>/dev/null; then
            echo "Warning: Found hardcoded absolute paths in notebooks"
            exit 1
          else
            echo "No hardcoded paths found ✓"
          fi
